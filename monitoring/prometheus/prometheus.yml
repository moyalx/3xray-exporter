global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # The 3X-UI exporter. It runs on the host (host networking) on :1819, so we
  # reach it from this container via the Docker host gateway. Change the target
  # if your exporter binds to a different host/port (LISTEN_ADDR).
  - job_name: hector-server
    static_configs:
      - targets: ["10.144.144.153:1819"]

  - job_name: cloud-exporter
    static_configs:
      - targets: ["10.144.144.151:1819"]

  - job_name: foly-server
    static_configs:
      - targets: ["10.144.144.254:1819"]

  - job_name: d-server
    static_configs:
      - targets: ["10.144.144.150:1819"]
